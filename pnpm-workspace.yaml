packages:
  - packages/*
  - examples/*

# The React Native packages are linked from a hoisted node_modules, as React Native's native build tooling expects
nodeLinker: hoisted

# The React Native package (devDependencies) and the example app use the same react / react-native, so Metro bundles a
# single copy of each
catalog:
  '@biomejs/biome': 2.6.2
  '@changesets/cli': ^3.0.3
  '@types/node': ^22.20.5
  koffi: ^3.3.3
  react: 19.3.0
  react-native: 0.88.0
  rimraf: ^6.1.3
  # 0.23.2 generates the type declarations with TypeScript's classic API, which TypeScript 7 doesn't have
  tsdown: 0.23.1
  typescript: ~7.0.2
  vitest: ^5.0.5

# pnpm only runs the install scripts of packages listed here, and fails the install for packages with scripts that
# aren't listed
allowBuilds:
  koffi: true
  esbuild: false
  # Dependencies of React Native Harness that ship prebuilt binaries
  '@parcel/watcher': false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@noxcturnal/noxcturnal-darwin-arm64@0.1.9'
  - '@noxcturnal/noxcturnal-darwin-x64@0.1.9'
  - '@noxcturnal/noxcturnal-linux-arm64-gnu@0.1.9'
  - '@noxcturnal/noxcturnal-linux-arm64-musl@0.1.9'
  - '@noxcturnal/noxcturnal-linux-x64-gnu@0.1.9'
  - '@noxcturnal/noxcturnal-linux-x64-musl@0.1.9'
  - '@noxcturnal/noxcturnal-win32-arm64-msvc@0.1.9'
  - '@noxcturnal/noxcturnal-win32-x64-msvc@0.1.9'
  - noxcturnal@0.1.9

# Patches for React Native Harness 1.6.0, until a release fixes them:
# - bridge: Harness fails the run when the app's JS thread doesn't answer its heartbeat within 20 seconds, and the
#   anoncreds calls and the test bundle evaluation block it longer than that on CI's iOS simulators. Raises the timeout
#   to 120 seconds. Remove once a release includes https://github.com/callstackincubator/react-native-harness/pull/226
# - bundler-metro: the serializer reads the `default` export of Metro modules that only have one since Metro 0.83.3, so
#   bundling fails with the Metro of Expo SDK 53 (0.82). Falls back to the module itself. Not fixed upstream yet
patchedDependencies:
  '@react-native-harness/bridge@1.6.0': patches/@react-native-harness__bridge@1.6.0.patch
  '@react-native-harness/bundler-metro@1.6.0': patches/@react-native-harness__bundler-metro@1.6.0.patch
